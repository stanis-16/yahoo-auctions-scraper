name: Yahoo Auctions Monitor

on:
  schedule:
    - cron: '*/20 * * * *'  # every 20 minutes
  workflow_dispatch:          # also lets you trigger it manually with one click

permissions:
  contents: write             # needed so the action can save seen.json back to the repo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # run all actions on Node 24 now

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5   # v5 is Node 24 native

      - name: Set up Python
        uses: actions/setup-python@v5  # no v6 yet; warning is cosmetic, works fine
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        run: python monitor.py

      - name: Save state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git add matches.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update state"
          git push
